name: "Deploy"

run-name: "Deploy `${{ inputs.version_type == 'latest' && 'latest' || inputs.specific_version }}` (`${{ inputs.platforms }}`)"

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version to deploy'
        required: true
        type: choice
        default: latest
        options:
          - latest
          - specific
      specific_version:
        description: 'Specific version tag (only used if version_type is "specific", ex: 1.2.3)'
        required: false
        type: string
      platforms:
        description: 'Platforms to deploy'
        required: true
        type: choice
        default: all
        options:
          - all
          - web
          - android
          - ios
      auto_submit_for_review:
        description: 'Auto-submit for review on App Store and Play. Leave unchecked to stage as drafts (which then require manual submission).'
        required: false
        type: boolean
        default: false
      push_store_assets:
        description: 'Re-upload store-listing assets (pushing unchanged assets is fine, it will just cause them to be part of the re-review).'
        required: false
        type: boolean
        default: false
      artifact_run_id:
        description: 'Automation only: the build.yml run whose artifacts to deploy (bypasses the release tag lookup). Leave blank for a manual deploy.'
        required: false
        type: string
  workflow_call:
    inputs:
      version_type:
        description: "Version to deploy"
        required: false
        type: string
        default: latest
      specific_version:
        description: "Specific version tag (used when version_type is specific)"
        required: false
        type: string
      environment:
        description: "Environment to deploy to"
        required: false
        type: string
        default: prod
      platforms:
        description: "Platforms to deploy"
        required: false
        type: string
        default: all
      auto_submit_for_review:
        description: 'Auto-submit for review on App Store and Play'
        required: false
        type: boolean
        default: false
      push_store_assets:
        description: 'Re-upload store-listing assets'
        required: false
        type: boolean
        default: false
      artifact_run_id:
        description: "The build.yml run whose artifacts to deploy"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: "helium-frontend-deploy"

jobs:
  resolve:
    name: Resolve Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      run_id: ${{ steps.resolve.outputs.run_id }}

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.HELIUM_BOT_APP_ID }}
          private-key: ${{ secrets.HELIUM_BOT_PRIVATE_KEY }}
          owner: HeliumEdu
          skip-token-revoke: true

      - name: Determine version to deploy
        id: version
        if: ${{ inputs.artifact_run_id == '' }}
        uses: HeliumEdu/.github/actions/determine-version@main
        with:
          token: ${{ steps.app-token.outputs.token }}
          repo: frontend
          specific-version: ${{ inputs.version_type != 'latest' && inputs.specific_version || '' }}

      - name: Find the build run that tested it
        id: resolve
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ inputs.artifact_run_id != '' && inputs.specific_version || steps.version.outputs.version }}
          RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          set -euo pipefail
          if [ -z "$RUN_ID" ]; then
            TAG_SHA=$(gh api "repos/HeliumEdu/frontend/git/ref/tags/${VERSION}" --jq .object.sha)
            RUN_ID=$(gh api "repos/HeliumEdu/frontend/git/tags/${TAG_SHA}" --jq .message | sed -n 's/^Build-Run: \([0-9]*\)$/\1/p')
            if [ -z "$RUN_ID" ]; then
              echo "::error::Tag ${VERSION} names no Build-Run, so its build artifacts can't be found."
              exit 1
            fi
          fi
          echo "Deploying ${VERSION} from build.yml run ${RUN_ID}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"

  deploy-web:
    name: Deploy Web
    if: inputs.platforms == 'web' || inputs.platforms == 'all'
    needs: [resolve]
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.HELIUM_BOT_APP_ID }}
          private-key: ${{ secrets.HELIUM_BOT_PRIVATE_KEY }}
          owner: HeliumEdu
          skip-token-revoke: true

      - uses: actions/checkout@v6

      - name: Download the tested build
        uses: actions/download-artifact@v8
        with:
          name: helium-${{ needs.resolve.outputs.version }}-web
          path: ./web-build
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to S3
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          BUCKET_NAME="heliumedu.prod.frontend-app.static"

          echo "Deploying version ${VERSION} to s3://${BUCKET_NAME} ..."

          aws s3 sync ./web-build "s3://${BUCKET_NAME}" \
            --delete \
            --cache-control "public, max-age=10800" \
            --exclude "index.html" \
            --exclude "*.json" \
            --exclude "*.bin" \
            --exclude "*.png" \
            --exclude "main.dart.js" \
            --exclude "flutter.js" \
            --exclude "flutter_bootstrap.js" \
            --exclude "canvaskit/*"

          aws s3 cp ./web-build/index.html "s3://${BUCKET_NAME}/index.html" \
            --cache-control "no-cache, no-store, must-revalidate"

          # Upload Flutter runtime entrypoints with no-cache to prevent stale JS
          # being paired with newer app metadata/assets.
          for FILE in main.dart.js flutter.js flutter_bootstrap.js; do
            if [ -f "./web-build/${FILE}" ]; then
              aws s3 cp "./web-build/${FILE}" "s3://${BUCKET_NAME}/${FILE}" \
                --cache-control "no-cache, no-store, must-revalidate" \
                --content-type "application/javascript"
            fi
          done

          aws s3 sync ./web-build "s3://${BUCKET_NAME}" \
            --exclude "*" \
            --include "*.json" \
            --exclude ".well-known/*" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "application/json"

          # Sync .bin files (e.g., AssetManifest.bin) with no-cache so the
          # asset manifest cannot drift behind the rest of the build.
          aws s3 sync ./web-build "s3://${BUCKET_NAME}" \
            --exclude "*" \
            --include "*.bin" \
            --cache-control "no-cache, no-store, must-revalidate"

          # Sync PNG assets with revalidation. URLs are stable across builds
          # but contents can change, so let the browser keep the bytes and
          # revalidate via ETag instead of refetching every load.
          aws s3 sync ./web-build "s3://${BUCKET_NAME}" \
            --exclude "*" \
            --include "*.png" \
            --cache-control "public, max-age=0, must-revalidate"

          # Sync CanvasKit runtime files with no-cache so JS/WASM stay in sync.
          if [ -d ./web-build/canvaskit ]; then
            aws s3 sync ./web-build/canvaskit "s3://${BUCKET_NAME}/canvaskit" \
              --cache-control "no-cache, no-store, must-revalidate"
          fi

          # Sync all .well-known files with correct content-type (includes extensionless files)
          if [ -d ./web-build/.well-known ]; then
            aws s3 sync ./web-build/.well-known "s3://${BUCKET_NAME}/.well-known" \
              --content-type "application/json" \
              --cache-control "public, max-age=10800"
          fi

          echo "Deployment complete!"

      - name: Invalidate CloudFront cache
        run: |
          DOMAIN="app.heliumedu.com"

          DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?contains(not_null(Aliases.Items, \`[]\`), '${DOMAIN}')].Id" \
            --output text)

          if [ -n "$DISTRIBUTION_ID" ] && [ "$DISTRIBUTION_ID" != "None" ]; then
            echo "Invalidating CloudFront distribution ${DISTRIBUTION_ID} for ${DOMAIN} ..."
            aws cloudfront create-invalidation \
              --distribution-id "$DISTRIBUTION_ID" \
              --paths "/*"
          else
            echo "Warning: Could not find CloudFront distribution for ${DOMAIN}"
          fi

      - name: Notify Sentry of deploy
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          npm install -g @sentry/cli@3.6.2
          SENTRY_DIST=$(jq -r .build_number ./web-build/version.json)
          SENTRY_PROPERTIES=sentry/sentry.properties sentry-cli releases deploys "$RELEASE_VERSION" new \
            --env prod \
            --name "dist-${SENTRY_DIST}"

      - name: Trigger canary tests
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh workflow run canary.yml \
            --repo HeliumEdu/frontend \
            -f environment=prod

      - name: Deployment summary
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          URL="https://app.heliumedu.com"
          BUILD_NUMBER=$(jq -r .build_number ./web-build/version.json)

          echo "### Web Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${VERSION}+${BUILD_NUMBER}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: ${URL}" >> $GITHUB_STEP_SUMMARY

  deploy-android:
    name: Deploy Android
    if: inputs.platforms == 'android' || inputs.platforms == 'all'
    needs: [resolve]
    runs-on: ubuntu-latest
    concurrency:
      group: helium-frontend-google-play

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.HELIUM_BOT_APP_ID }}
          private-key: ${{ secrets.HELIUM_BOT_PRIVATE_KEY }}
          owner: HeliumEdu
          skip-token-revoke: true

      - uses: actions/checkout@v6

      - name: Download the tested build
        uses: actions/download-artifact@v8
        with:
          name: helium-${{ needs.resolve.outputs.version }}-android
          path: ./android-build
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler: 'Gemfile.lock'
          bundler-cache: false

      - name: Install Fastlane
        run: |
          cd android && bundle install

      - name: Decode Google Play service account key
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_KEY }}
        run: |
          echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_KEY" > android/service-account-key.json

      - name: Stage Google Play release
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          AUTO_SUBMIT_FOR_REVIEW: ${{ inputs.auto_submit_for_review }}
          PUSH_STORE_ASSETS: ${{ inputs.push_store_assets }}
        run: |
          VERSION_CODE=$(cat ./android-build/version_code.txt)
          echo "Staging Google Play release $VERSION ($VERSION_CODE) ..."
          cd android
          bundle exec fastlane deploy_production version:$VERSION version_code:$VERSION_CODE submit_for_review:$AUTO_SUBMIT_FOR_REVIEW push_store_assets:$PUSH_STORE_ASSETS

      - name: Cleanup service account key
        if: always()
        run: rm -f android/service-account-key.json

      - name: Deployment summary
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          AUTO_SUBMIT_FOR_REVIEW: ${{ inputs.auto_submit_for_review }}
        run: |
          if [ "$AUTO_SUBMIT_FOR_REVIEW" = "true" ]; then
            STATUS="Submitted for review. Once Google approves, Managed Publishing holds the release for a manual **Publish** click."
          else
            STATUS="Staged as a draft. Click **Send for review** in Play Console when ready."
          fi

          VERSION_CODE=$(cat ./android-build/version_code.txt)

          echo "### Android Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${VERSION}+${VERSION_CODE}" >> $GITHUB_STEP_SUMMARY
          echo "- **Release tag**: ${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "- **Track**: Production" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${STATUS}" >> $GITHUB_STEP_SUMMARY
          echo "- **Console**: [Google Play Console](https://play.google.com/console/developers/5225481146664498498/app/4975537823503737498/tracks/production)" >> $GITHUB_STEP_SUMMARY

  deploy-ios:
    name: Deploy iOS
    if: inputs.platforms == 'ios' || inputs.platforms == 'all'
    needs: [resolve]
    runs-on: macos-latest
    concurrency:
      group: helium-frontend-app-store

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.HELIUM_BOT_APP_ID }}
          private-key: ${{ secrets.HELIUM_BOT_PRIVATE_KEY }}
          owner: HeliumEdu
          skip-token-revoke: true

      - uses: actions/checkout@v6

      - name: Download the tested build
        uses: actions/download-artifact@v8
        with:
          name: helium-${{ needs.resolve.outputs.version }}-ios
          path: ./ios-build
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler: 'Gemfile.lock'
          bundler-cache: false

      - name: Install Fastlane
        run: |
          cd ios && bundle install

      - name: Stage App Store version
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_TEAM_ID: ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}
          VERSION: ${{ needs.resolve.outputs.version }}
          AUTO_SUBMIT_FOR_REVIEW: ${{ inputs.auto_submit_for_review }}
          PUSH_STORE_ASSETS: ${{ inputs.push_store_assets }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

          cd ios
          BUILD=$(cat ../ios-build/build_number.txt)
          echo "Staging App Store version $VERSION ($BUILD) ..."
          bundle exec fastlane deploy_appstore version:$VERSION build_number:$BUILD submit_for_review:$AUTO_SUBMIT_FOR_REVIEW push_store_assets:$PUSH_STORE_ASSETS

      - name: Cleanup API key
        if: always()
        run: rm -rf ~/.appstoreconnect

      - name: Deployment summary
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          AUTO_SUBMIT_FOR_REVIEW: ${{ inputs.auto_submit_for_review }}
        run: |
          if [ "$AUTO_SUBMIT_FOR_REVIEW" = "true" ]; then
            STATUS="Submitted for review. Once Apple approves, the version releases automatically."
          else
            STATUS="Staged as a draft. Click **Submit for Review** in App Store Connect when ready."
          fi

          echo "### iOS Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${VERSION}+$(cat ./ios-build/build_number.txt)" >> $GITHUB_STEP_SUMMARY
          echo "- **Destination**: App Store" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${STATUS}" >> $GITHUB_STEP_SUMMARY
          echo "- **Console**: [App Store Connect](https://appstoreconnect.apple.com/apps/6758323154/distribution/ios/version/deliverable)" >> $GITHUB_STEP_SUMMARY
