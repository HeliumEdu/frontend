name: Auto-Merge Renovate PRs

run-name: Auto-Merge PR #${{ github.event.pull_request.number }}

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: helium-frontend-automerge-${{ github.event.pull_request.number }}

jobs:
  refresh-lockfiles:
    name: Refresh Lockfiles
    if: contains(github.event.pull_request.labels.*.name, 'renovate')
    uses: ./.github/workflows/refresh-lockfiles.yml
    with:
      ref: ${{ github.head_ref }}
      pod_update: true
    secrets: inherit

  automerge:
    needs: refresh-lockfiles
    uses: alexdlaird/.github/.github/workflows/automerge.yml@main
    permissions:
      contents: write
      pull-requests: write
    with:
      renovate_label: renovate
