name: "Build"

run-name: "Build"

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:
    inputs:
      run_integration_tests:
        description: 'Run integration tests'
        required: true
        type: boolean
        default: true
      deploy_web:
        description: 'Deploy the web build (manual runs only)'
        required: true
        type: choice
        default: none
        options:
          - none
          - dev
      deploy_candidates:
        description: 'Upload TestFlight / Play Internal builds (any branch but main)'
        required: true
        type: choice
        default: none
        options:
          - none
          - ios
          - android
          - all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  issues: none
  pull-requests: none

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Read Flutter version
        id: flutter-version
        run: echo "version=$(tr -d '[:space:]' < .flutter-version)" >> $GITHUB_OUTPUT

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Add pub cache to PATH
        run: echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
      - name: Install lcov
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov
      - name: Test
        run: make test coverage
      - name: Upload test coverage
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  integration-test:
    name: Integration Test
    if: ${{ github.actor != 'renovate[bot]' && github.actor != 'dependabot[bot]' && !contains(github.event.head_commit.message, '[skip ci]') && (github.event_name != 'workflow_dispatch' || inputs.run_integration_tests) }}
    uses: ./.github/workflows/integration.yml
    with:
      suite: full
      caller: build
    secrets: inherit

  build-android:
    name: Build Android
    # The PR check that the app compiles; on a push the signed candidate build does that.
    if: ${{ github.event_name != 'push' && !(github.event_name == 'workflow_dispatch' && inputs.deploy_web == 'dev') }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          cache-dependency-path: android/*.gradle*

      - name: Read Flutter version
        id: flutter-version
        run: echo "version=$(tr -d '[:space:]' < .flutter-version)" >> $GITHUB_OUTPUT

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Build Android
        run: make build-android

  build-ios:
    name: Build iOS
    if: ${{ github.event_name != 'push' && !(github.event_name == 'workflow_dispatch' && inputs.deploy_web == 'dev') }}

    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Select latest stable Xcode
        uses: alexdlaird/shipshape/select-xcode@v1

      - name: Read Flutter version
        id: flutter-version
        run: echo "version=$(tr -d '[:space:]' < .flutter-version)" >> $GITHUB_OUTPUT

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Build iOS
        env:
          COCOAPODS_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make build-ios

  build-web:
    name: Build web
    # deploy-web compiles the web build whenever it runs
    if: >-
      ${{ !((github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_web == 'dev')) }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Read Flutter version
        id: flutter-version
        run: echo "version=$(tr -d '[:space:]' < .flutter-version)" >> $GITHUB_OUTPUT

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Build web
        run: make build-web
  deploy-web:
    name: Deploy web (${{ github.event_name == 'workflow_dispatch' && 'dev' || 'CI preview' }})
    if: >-
      ${{ (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_web == 'dev') }}

    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.HELIUM_BOT_APP_ID }}
          private-key: ${{ secrets.HELIUM_BOT_PRIVATE_KEY }}
          skip-token-revoke: true

      - uses: actions/checkout@v6

      - name: Resolve deploy target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            {
              echo "label=Dev"
              echo "bucket=heliumedu.dev.frontend-app.static"
              echo "environment=dev"
              echo "sentry_environment=dev"
              echo "firebase_auth_domain="
              echo "cf_comment=app.dev.heliumedu.com"
              echo "canary_env="
              echo "url=https://app.dev.heliumedu.com"
              echo "api=https://api.dev.heliumedu.com"
            } >> $GITHUB_OUTPUT
          else
            {
              echo "label=CI Preview"
              echo "bucket=heliumedu.ci.frontend-app.static"
              echo "environment=prod"
              echo "sentry_environment="
              echo "firebase_auth_domain=auth.heliumedu.com"
              echo "cf_comment=heliumedu-ci-frontend-app"
              echo "canary_env=ci"
              echo "url="
              echo "api=https://api.heliumedu.com"
            } >> $GITHUB_OUTPUT
          fi

      - name: Read Flutter version
        id: flutter-version
        run: echo "version=$(tr -d '[:space:]' < .flutter-version)" >> $GITHUB_OUTPUT

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Read version
        id: ci-version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build-number=${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "CI build: ${VERSION}+${{ github.run_number }}"

      - name: Build web
        env:
          ENVIRONMENT: ${{ steps.target.outputs.environment }}
          SENTRY_ENVIRONMENT: ${{ steps.target.outputs.sentry_environment }}
          FIREBASE_AUTH_DOMAIN: ${{ steps.target.outputs.firebase_auth_domain }}
          RELEASE_VERSION: ${{ steps.ci-version.outputs.version }}
          BUILD_NUMBER: ${{ steps.ci-version.outputs.build-number }}
          PROJECT_API_HOST: ${{ steps.target.outputs.api }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          ARGS="ENVIRONMENT=${ENVIRONMENT} SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT}"
          ARGS="$ARGS RELEASE_VERSION=${RELEASE_VERSION} SENTRY_DIST=${BUILD_NUMBER} BUILD_NUMBER=${BUILD_NUMBER} SENTRY_DSN=${SENTRY_DSN}"
          ARGS="$ARGS PROJECT_API_HOST=${PROJECT_API_HOST}"
          if [ -n "$FIREBASE_AUTH_DOMAIN" ]; then
            ARGS="$ARGS FIREBASE_AUTH_DOMAIN=${FIREBASE_AUTH_DOMAIN}"
          fi
          make build-web $ARGS

      - name: Upload source maps to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          RELEASE_VERSION: ${{ steps.ci-version.outputs.version }}
          BUILD_NUMBER: ${{ steps.ci-version.outputs.build-number }}
        run: |
          npm install -g @sentry/cli@3.6.2
          make upload-web-symbols RELEASE_VERSION="$RELEASE_VERSION" SENTRY_DIST="$BUILD_NUMBER"

      - name: Upload release candidate
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@v7
        with:
          name: helium-${{ steps.ci-version.outputs.version }}-web
          path: build/web
          include-hidden-files: true
          retention-days: 90

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to S3
        env:
          BUCKET_NAME: ${{ steps.target.outputs.bucket }}
        run: |
          aws s3 sync ./build/web "s3://${BUCKET_NAME}" \
            --delete \
            --cache-control "public, max-age=2592000" \
            --exclude "index.html" \
            --exclude "*.json" \
            --exclude "main.dart.js" \
            --exclude "flutter.js" \
            --exclude "flutter_bootstrap.js" \
            --exclude "canvaskit/*"

          aws s3 cp ./build/web/index.html "s3://${BUCKET_NAME}/index.html" \
            --cache-control "no-cache, no-store, must-revalidate"

          for FILE in main.dart.js flutter.js flutter_bootstrap.js; do
            if [ -f "./build/web/${FILE}" ]; then
              aws s3 cp "./build/web/${FILE}" "s3://${BUCKET_NAME}/${FILE}" \
                --cache-control "no-cache, no-store, must-revalidate" \
                --content-type "application/javascript"
            fi
          done

          find ./build/web -name "*.json" ! -path "./build/web/.well-known/*" -exec sh -c 'RELPATH="${1#./build/web/}"; aws s3 cp "$1" "s3://'"${BUCKET_NAME}"'/${RELPATH}" --cache-control "no-cache, no-store, must-revalidate" --content-type "application/json"' _ {} \;

          if [ -d ./build/web/canvaskit ]; then
            find ./build/web/canvaskit -type f -exec sh -c 'RELPATH="${1#./build/web/}"; aws s3 cp "$1" "s3://'"${BUCKET_NAME}"'/${RELPATH}" --cache-control "no-cache, no-store, must-revalidate"' _ {} \;
          fi

          if [ -d ./build/web/.well-known ]; then
            find ./build/web/.well-known -type f -exec sh -c 'RELPATH="${1#./build/web/}"; aws s3 cp "$1" "s3://'"${BUCKET_NAME}"'/${RELPATH}" --content-type "application/json" --cache-control "public, max-age=86400"' _ {} \;
          fi

      - name: Invalidate CloudFront cache
        id: cloudfront
        env:
          CF_COMMENT: ${{ steps.target.outputs.cf_comment }}
        run: |
          DISTRIBUTION=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='${CF_COMMENT}'] | [0].{Id: Id, Domain: DomainName}" \
            --output json)

          DISTRIBUTION_ID=$(echo "$DISTRIBUTION" | jq -r '.Id // empty')
          DOMAIN_NAME=$(echo "$DISTRIBUTION" | jq -r '.Domain // empty')

          if [ -n "$DISTRIBUTION_ID" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "$DISTRIBUTION_ID" \
              --paths "/*"
            echo "domain=${DOMAIN_NAME}" >> $GITHUB_OUTPUT
          else
            echo "Warning: no CloudFront distribution found with comment '${CF_COMMENT}'"
          fi

      - name: Trigger canary tests
        if: ${{ steps.target.outputs.canary_env != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CANARY_ENV: ${{ steps.target.outputs.canary_env }}
        run: |
          gh workflow run canary.yml \
            --repo ${{ github.repository }} \
            -f environment="$CANARY_ENV"

      - name: Deployment summary
        env:
          LABEL: ${{ steps.target.outputs.label }}
          API: ${{ steps.target.outputs.api }}
          URL: ${{ steps.target.outputs.url }}
          DISCOVERED: ${{ steps.cloudfront.outputs.domain }}
        run: |
          echo "### ${LABEL} Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.ci-version.outputs.version }}+${{ steps.ci-version.outputs.build-number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **API**: ${API}" >> $GITHUB_STEP_SUMMARY
          if [ -n "$URL" ]; then
            echo "- **URL**: ${URL}" >> $GITHUB_STEP_SUMMARY
          elif [ -n "$DISCOVERED" ]; then
            echo "- **URL**: https://${DISCOVERED}" >> $GITHUB_STEP_SUMMARY
          fi

  publish-web-container:
    name: Publish web container (release candidate)
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      PLATFORM: amd64
      TAG_VERSION: ${{ github.sha }}
      ENVIRONMENT: prod

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish web container
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          RELEASE_VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          make publish RELEASE_VERSION="$RELEASE_VERSION" SENTRY_DIST="${{ github.run_number }}" SENTRY_DSN="$SENTRY_DSN"

  deploy-ios-ci:
    name: Deploy iOS (CI preview)
    needs: [test, integration-test]
    if: >-
      ${{ !cancelled() && needs.test.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs['integration-test'].result) &&
      github.ref != 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["ios", "all"]'), inputs.deploy_candidates))) }}
    uses: alexdlaird/.github/.github/workflows/flutter-ios-candidate.yml@main
    with:
      app_name: helium-frontend
      runs_on: '"macos-latest"'
      dotenv: ''
      crashlytics: false
    secrets:
      app_store_connect_api_key_id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      app_store_connect_api_issuer_id: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      app_store_connect_api_key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      build_secrets: |
        SENTRY_DSN=${{ secrets.SENTRY_DSN }}
        SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
        APP_STORE_CONNECT_TEAM_ID=${{ secrets.APP_STORE_CONNECT_TEAM_ID }}
        COCOAPODS_GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}

  deploy-android-ci:
    name: Deploy Android (CI preview)
    needs: [test, integration-test]
    if: >-
      ${{ !cancelled() && needs.test.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs['integration-test'].result) &&
      github.ref != 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["android", "all"]'), inputs.deploy_candidates))) }}
    uses: alexdlaird/.github/.github/workflows/flutter-android-candidate.yml@main
    with:
      app_name: helium-frontend
      dotenv: ''
    secrets:
      google_play_service_account_key: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_KEY }}
      android_keystore_base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      android_signing_key_alias: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      android_signing_key_password: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      android_signing_store_password: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      build_secrets: |
        SENTRY_DSN=${{ secrets.SENTRY_DSN }}
        SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
