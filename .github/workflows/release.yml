name: "Release"

run-name: "Release `${{ inputs.platforms }}`"

on:
  workflow_dispatch:
    inputs:
      trigger_deploy_after_release:
        description: 'Trigger deploy after release'
        required: true
        type: boolean
        default: true
      platforms:
        description: 'Platforms to deploy'
        required: true
        type: choice
        default: all
        options:
          - all
          - web
          - android
          - ios
      auto_submit_for_review:
        description: 'Auto-submit for review on App Store and Play. Leave unchecked to stage as drafts (which then require manual submission).'
        required: false
        type: boolean
        default: false
      push_store_assets:
        description: 'Re-upload store-listing assets (pushing unchanged assets is fine, it will just cause them to be part of the re-review).'
        required: false
        type: boolean
        default: false
      consolidate_history:
        description: 'Reset develop to main after release (force-push).'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      trigger_deploy_after_release:
        description: "Trigger deploy after release"
        required: false
        type: boolean
        default: true
      environment:
        description: "Environment to deploy to"
        required: false
        type: string
        default: prod
      platforms:
        description: "Platforms to deploy"
        required: false
        type: string
        default: all
      auto_submit_for_review:
        description: "Auto-submit for review on both stores"
        required: false
        type: boolean
        default: false
      push_store_assets:
        description: "Re-upload store-listing assets"
        required: false
        type: boolean
        default: false
      consolidate_history:
        description: "Reset develop to main after release (force-push)"
        required: false
        type: boolean
        default: false
    outputs:
      version:
        description: "Released version"
        value: ${{ jobs.prereq.outputs.version }}

permissions:
  contents: write

concurrency:
  group: helium-frontend-release

jobs:
  prereq:
    uses: alexdlaird/.github/.github/workflows/release-prereq.yml@main
    with:
      version_pattern: 's/^version: .*/version: ${VERSION}/'
      version_file: pubspec.yaml
      repo_slug: HeliumEdu/frontend
    secrets:
      bot_app_id: ${{ secrets.HELIUM_BOT_APP_ID }}
      bot_private_key: ${{ secrets.HELIUM_BOT_PRIVATE_KEY }}

  promote-web-container:
    name: Promote Web Container
    needs: [prereq]
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      PLATFORM: amd64
      SOURCE_TAG: ${{ needs.prereq.outputs.squash_boundary_sha }}
      TAG_VERSION: ${{ needs.prereq.outputs.version }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prereq.outputs.squash_commit_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Tag the image with the release version and publish its files
        run: make promote

  create-release-tag:
    name: Create Release Tag
    needs: [prereq, promote-web-container]
    if: "!cancelled() && needs.prereq.result == 'success' && needs['promote-web-container'].result == 'success'"
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.HELIUM_BOT_APP_ID }}
          private-key: ${{ secrets.HELIUM_BOT_PRIVATE_KEY }}
          skip-token-revoke: true

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ needs.prereq.outputs.squash_commit_sha }}
          fetch-depth: 0

      - name: Get GitHub App bot user ID
        id: get-bot-user-id
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          VERSION: ${{ needs.prereq.outputs.version }}
          COMMIT_SHA: ${{ needs.prereq.outputs.squash_commit_sha }}
          BUILD_RUN_ID: ${{ needs.prereq.outputs.build_run_id }}
        run: |
          git config --global user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config --global user.email "${{ steps.get-bot-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists, skipping"
          else
            echo "Creating tag $VERSION on commit $COMMIT_SHA"
            # deploy.yml reads Build-Run to find the build artifacts for a re-deploy of this version
            git tag -a "$VERSION" -m "Release $VERSION" -m "Build-Run: ${BUILD_RUN_ID}" "$COMMIT_SHA"
            git push origin "$VERSION"
          fi

      - name: Create Sentry release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          VERSION: ${{ needs.prereq.outputs.version }}
        run: |
          npm install -g @sentry/cli@3.6.2
          SENTRY_PROPERTIES=sentry/sentry.properties sentry-cli releases new "$VERSION"
          SENTRY_PROPERTIES=sentry/sentry.properties sentry-cli releases set-commits --auto "$VERSION"
          SENTRY_PROPERTIES=sentry/sentry.properties sentry-cli releases finalize "$VERSION"

  deploy:
    name: Deploy
    needs: [prereq, create-release-tag]
    if: "!cancelled() && (inputs.trigger_deploy_after_release == true || inputs.trigger_deploy_after_release == 'true') && needs.prereq.result == 'success' && needs['create-release-tag'].result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (inputs.platforms == 'web' || inputs.platforms == 'android') && 20 || inputs.platforms == 'ios' && 40 || 100 }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prereq.outputs.squash_commit_sha }}

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.HELIUM_BOT_APP_ID }}
          private-key: ${{ secrets.HELIUM_BOT_PRIVATE_KEY }}
          skip-token-revoke: true

      - name: Record current deploy run
        id: prior-run
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PRIOR_RUN_ID=$(gh run list --repo ${{ github.repository }} --workflow deploy.yml --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          echo "run_id=${PRIOR_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Trigger deploy workflow
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.prereq.outputs.version }}
          PLATFORMS: ${{ inputs.platforms }}
          AUTO_SUBMIT_FOR_REVIEW: ${{ inputs.auto_submit_for_review }}
          PUSH_STORE_ASSETS: ${{ inputs.push_store_assets }}
        run: |
          gh workflow run deploy.yml \
            --repo ${{ github.repository }} \
            -f version_type=specific \
            -f specific_version="$VERSION" \
            -f platforms="$PLATFORMS" \
            -f auto_submit_for_review="$AUTO_SUBMIT_FOR_REVIEW" \
            -f push_store_assets="$PUSH_STORE_ASSETS" \
            -f artifact_run_id="${{ needs.prereq.outputs.build_run_id }}"

      - name: Wait for deploy workflow to finish
        id: wait-for-deploy
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: deploy.yml
          PRIOR_RUN_ID: ${{ steps.prior-run.outputs.run_id }}
          RETRIES: ${{ (inputs.platforms == 'web' || inputs.platforms == 'android') && 30 || inputs.platforms == 'ios' && 60 || 180 }}
        run: bash bin/wait-for-deploy-run.sh

      - name: Deployment trigger summary
        if: always()
        env:
          VERSION: ${{ needs.prereq.outputs.version }}
          PLATFORMS: ${{ inputs.platforms }}
          RUN_URL: ${{ steps.wait-for-deploy.outputs.run_url }}
        run: |
          echo "### Deploy Workflow Triggered" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Platforms**: $PLATFORMS" >> $GITHUB_STEP_SUMMARY
          if [ -n "$RUN_URL" ]; then
            echo "- **Run**: $RUN_URL" >> $GITHUB_STEP_SUMMARY
          fi

  cleanup:
    needs: [prereq, create-release-tag, deploy]
    if: always() && needs.prereq.result == 'success'
    uses: alexdlaird/.github/.github/workflows/release-cleanup.yml@main
    with:
      # Consolidation is honoured only when the release actually shipped. Any
      # earlier failure leaves the merge path, which keeps the granular history.
      consolidate_history: ${{ (inputs.consolidate_history == true || inputs.consolidate_history == 'true') && needs['create-release-tag'].result == 'success' }}
      squash_boundary_sha: ${{ needs.prereq.outputs.squash_boundary_sha }}
    secrets:
      bot_app_id: ${{ secrets.HELIUM_BOT_APP_ID }}
      bot_private_key: ${{ secrets.HELIUM_BOT_PRIVATE_KEY }}

  bump:
    needs: [create-release-tag, cleanup]
    if: always() && needs['create-release-tag'].result == 'success'
    uses: ./.github/workflows/bump-version.yml
    with:
      bump_type: next
    secrets: inherit
