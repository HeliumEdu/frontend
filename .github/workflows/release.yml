name: "Release"

run-name: "Release `${{ inputs.platforms }}`"

on:
  workflow_dispatch:
    inputs:
      trigger_deploy_after_release:
        description: 'Trigger deploy after release'
        required: true
        type: boolean
        default: true
      platforms:
        description: 'Platforms to deploy'
        required: true
        type: choice
        default: all
        options:
          - all
          - web
          - android
          - ios
      auto_submit_for_review:
        description: 'Auto-submit for review on App Store and Play. Leave unchecked to stage as drafts (which then require manual submission).'
        required: false
        type: boolean
        default: false
      push_store_assets:
        description: 'Re-upload store-listing assets (pushing unchanged assets is fine, it will just cause them to be part of the re-review).'
        required: false
        type: boolean
        default: false
      replace_pending_review:
        description: 'When submitting, replace a submission still waiting for review (it loses its place in the queue; one Apple is already reviewing is never touched)'
        required: false
        type: boolean
        default: true
      consolidate_history:
        description: 'Reset develop to main after release (force-push).'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: helium-frontend-release

jobs:
  prereq:
    uses: alexdlaird/.github/.github/workflows/release-prereq.yml@main
    with:
      version_pattern: 's/^version: .*/version: ${VERSION}/'
      version_file: pubspec.yaml
      repo_slug: HeliumEdu/frontend
    secrets:
      bot_app_id: ${{ secrets.HELIUM_BOT_APP_ID }}
      bot_private_key: ${{ secrets.HELIUM_BOT_PRIVATE_KEY }}

  promote-web-container:
    name: Promote Web Container
    needs: [prereq]
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      PLATFORM: amd64
      SOURCE_TAG: ${{ needs.prereq.outputs.squash_boundary_sha }}
      TAG_VERSION: ${{ needs.prereq.outputs.version }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prereq.outputs.squash_commit_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Tag the image with the release version and publish its files
        run: make promote

  sentry-release:
    name: Create Sentry Release
    needs: [prereq, promote-web-container]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prereq.outputs.squash_commit_sha }}
          fetch-depth: 0

      - name: Create the Sentry release
        uses: alexdlaird/shipshape/sentry-release@v1
        with:
          version: ${{ needs.prereq.outputs.version }}
          sentry-properties: sentry/sentry.properties
          sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}

  deploy:
    name: Deploy
    needs: [prereq, sentry-release]
    if: "!cancelled() && (inputs.trigger_deploy_after_release == true || inputs.trigger_deploy_after_release == 'true') && needs['sentry-release'].result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (inputs.platforms == 'web' || inputs.platforms == 'android') && 20 || inputs.platforms == 'ios' && 40 || 100 }}

    steps:
      - name: Run the deploy workflow and wait for it
        id: wait-for-deploy
        uses: alexdlaird/shipshape/run-workflow@v1
        with:
          workflow: deploy.yml
          ref: develop
          token: ${{ github.token }}
          timeout-minutes: ${{ (inputs.platforms == 'web' || inputs.platforms == 'android') && 15 || inputs.platforms == 'ios' && 30 || 90 }}
          inputs: |
            version_type=specific
            specific_version=${{ needs.prereq.outputs.version }}
            platforms=${{ inputs.platforms }}
            auto_submit_for_review=${{ inputs.auto_submit_for_review }}
            push_store_assets=${{ inputs.push_store_assets }}
            replace_pending_review=${{ inputs.replace_pending_review }}
            artifact_run_id=${{ needs.prereq.outputs.build_run_id }}
            ref=${{ needs.prereq.outputs.squash_commit_sha }}

      - name: Deployment trigger summary
        if: always()
        env:
          VERSION: ${{ needs.prereq.outputs.version }}
          PLATFORMS: ${{ inputs.platforms }}
          RUN_URL: ${{ steps.wait-for-deploy.outputs.run-url }}
        run: |
          echo "### Deploy Workflow Triggered" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Platforms**: $PLATFORMS" >> $GITHUB_STEP_SUMMARY
          if [ -n "$RUN_URL" ]; then
            echo "- **Run**: $RUN_URL" >> $GITHUB_STEP_SUMMARY
          fi

  finish:
    needs: [prereq, sentry-release, deploy]
    if: always() && needs.prereq.result == 'success'
    uses: alexdlaird/.github/.github/workflows/release-finish.yml@main
    with:
      shipped: ${{ needs['sentry-release'].result == 'success' && (needs.deploy.result == 'success' || !(inputs.trigger_deploy_after_release == true || inputs.trigger_deploy_after_release == 'true')) }}
      version: ${{ needs.prereq.outputs.version }}
      squash_commit_sha: ${{ needs.prereq.outputs.squash_commit_sha }}
      squash_boundary_sha: ${{ needs.prereq.outputs.squash_boundary_sha }}
      build_run_id: ${{ needs.prereq.outputs.build_run_id }}
      consolidate_history: ${{ inputs.consolidate_history == true || inputs.consolidate_history == 'true' }}
      version_file: pubspec.yaml
      version_pattern: 's/^version: .*/version: ${VERSION}/'
      repo_slug: HeliumEdu/frontend
    secrets:
      bot_app_id: ${{ secrets.HELIUM_BOT_APP_ID }}
      bot_private_key: ${{ secrets.HELIUM_BOT_PRIVATE_KEY }}
